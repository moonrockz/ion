name: Release

# A `v*` tag, or a manual run on main (which tags the next version from the
# conventional commits), releases the module: validate, publish to
# mooncakes.io with the organization's MOONCAKES_USER_TOKEN, build the native
# CLI, and create the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Skip the mooncakes.io publish (for troubleshooting)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      tag_exists: ${{ steps.plan.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run setup:deps

      - name: Plan the release
        id: plan
        run: mise run release:plan

      - name: Check formatting
        run: mise run format:check

      - name: Check code
        run: mise run test:check

      - name: Run the tests
        id: tests
        shell: bash
        run: mise run ci:test --log "$RUNNER_TEMP/conformance-results/moon-test.log"

      - name: Publish conformance summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: >-
          mise run ci:conformance-summary
          "$RUNNER_TEMP/conformance-results/moon-test.log"
          --exit-code "$TEST_EXIT_CODE"
          --output-dir "$RUNNER_TEMP/conformance-results"

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance-results/

  tag:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && needs.validate.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Create and push the tag
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: mise run release:tag "${{ needs.validate.outputs.version }}"

  publish:
    needs: [validate, tag]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped') &&
      !(github.event.inputs.skip_publish == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run setup:deps

      - name: Set up mooncakes credentials
        run: mise run release:credentials
        env:
          MOONCAKES_USER_TOKEN: ${{ secrets.MOONCAKES_USER_TOKEN }}

      - name: Publish to mooncakes.io
        run: mise run release:publish

  build-native:
    needs: [validate, publish]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ion-linux-amd64
          - os: macos-latest
            artifact: ion-macos-arm64
          - os: windows-latest
            artifact: ion-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run setup:deps

      - name: Build native binary
        run: mise run build:native

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: _build/native/release/build/ion.exe

  release:
    needs: [validate, build-native]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.build-native.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: mise run release:prepare-assets

      - name: Generate release notes
        run: mise run release:notes "${{ needs.validate.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Release ${{ needs.validate.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ needs.validate.outputs.prerelease }}
          files: release/*
          make_latest: true
