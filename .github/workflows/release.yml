name: Release

# A `v*` tag, or a manual run on main (which tags the next version from the
# conventional commits), releases the module: validate, publish to
# mooncakes.io with the organization's MOONCAKES_USER_TOKEN, build the native
# CLI, and create the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Skip the mooncakes.io publish (for troubleshooting)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      notes: ${{ steps.notes.outputs.notes }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Guard branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Error: releases run only from main (current: ${GITHUB_REF_NAME})" >&2
            exit 1
          fi

      - name: Install dependencies
        run: moon update

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(mise run release:version 2>/dev/null | tail -1)
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Check that the version matches moon.mod
        run: |
          MODULE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' moon.mod)
          if [ "$MODULE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "Error: moon.mod has version $MODULE_VERSION, but the release is ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Check if the tag already exists
        id: check_tag
        run: |
          if git tag -l "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_EXISTS: ${{ steps.check_tag.outputs.exists }}
        run: |
          if [ "$TAG_EXISTS" = "true" ]; then
            NOTES=$(git cliff --latest --strip header)
          else
            NOTES=$(git cliff --unreleased --tag "v$VERSION" --strip header)
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "notes<<$EOF"
            echo "$NOTES"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release readiness
        id: tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/conformance-results"
          if mise run release:pre-check 2>&1 | tee "$RUNNER_TEMP/conformance-results/moon-test.log"; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            status=$?
            echo "exit_code=$status" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi

      - name: Publish conformance summary
        if: always()
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: |
          python3 .github/scripts/conformance_summary.py \
            "$RUNNER_TEMP/conformance-results/moon-test.log" \
            --exit-code "$TEST_EXIT_CODE" \
            --output-dir "$RUNNER_TEMP/conformance-results"

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance-results/

  tag:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && needs.validate.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push the tag
        run: |
          VERSION="v${{ needs.validate.outputs.version }}"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

  publish:
    needs: [validate, tag]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped') &&
      !(github.event.inputs.skip_publish == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Set up mooncakes credentials
        run: mise run release:credentials
        env:
          MOONCAKES_USER_TOKEN: ${{ secrets.MOONCAKES_USER_TOKEN }}

      - name: Publish to mooncakes.io
        run: moon publish

  build-native:
    needs: [validate, publish]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ion-linux-amd64
          - os: macos-latest
            artifact: ion-macos-arm64
          - os: windows-latest
            artifact: ion-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Build native binary
        run: mise run build:native

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: _build/native/release/build/ion.exe

  release:
    needs: [validate, build-native]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.build-native.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: mise run release:prepare-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Release ${{ needs.validate.outputs.version }}
          body: ${{ needs.validate.outputs.notes }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          files: release/*
          make_latest: true
