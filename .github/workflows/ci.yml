name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Check formatting
        run: |
          moon fmt
          git diff --exit-code || (echo "::error::moon fmt produced changes — run 'moon fmt' locally and commit" && exit 1)

      - name: Check code
        run: moon check

      - name: Test CI reporting
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  unit-tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm
          - os: ubuntu-latest
            target: native
          - os: ubuntu-latest
            target: js
          - os: ubuntu-latest
            target: wasm-gc
          - os: windows-latest
            target: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: hustcer/setup-moonbit@v1

      - uses: actions/setup-node@v4
        if: matrix.target == 'js'
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Run unit tests
        id: tests
        shell: bash
        env:
          TEST_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/conformance-results"
          if moon test --target "$TEST_TARGET" 2>&1 | tee "$RUNNER_TEMP/conformance-results/moon-test.log"; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            status=$?
            echo "exit_code=$status" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi

      - name: Publish conformance summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          TEST_TARGET: ${{ matrix.target }}
        run: |
          python .github/scripts/conformance_summary.py \
            "$RUNNER_TEMP/conformance-results/moon-test.log" \
            --exit-code "$TEST_EXIT_CODE" \
            --target "$TEST_TARGET" \
            --output-dir "$RUNNER_TEMP/conformance-results"

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-${{ matrix.os }}-${{ matrix.target }}
          path: ${{ runner.temp }}/conformance-results/

  build-native:
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ion-linux-amd64
          - os: macos-latest
            artifact: ion-macos-arm64
          - os: windows-latest
            artifact: ion-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Build native binary
        run: mise run build:native

  cli-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Print an Ion fixture
        run: moon run pkgs -- print tests/fixtures/sample.ion

      - name: Convert an Ion fixture to JSON
        run: moon run pkgs -- json tests/fixtures/sample.ion

      - name: Stream Ion from stdin
        run: moon run pkgs -- hash - < tests/fixtures/sample.ion

      - name: Round-trip a fixture through Ion binary
        run: |
          moon run pkgs -- print --binary tests/fixtures/sample.ion > sample.10n
          moon run pkgs -- print sample.10n > from-binary.ion
          moon run pkgs -- print tests/fixtures/sample.ion > from-text.ion
          diff from-text.ion from-binary.ion

      - name: Convert a JSON fixture to Ion
        run: moon run pkgs -- fromjson tests/fixtures/sample.json

      - name: Validate fixtures (a violation must exit non-zero)
        run: |
          if moon run pkgs -- validate tests/fixtures/person.isl person tests/fixtures/person.ion; then
            echo "::error::validation unexpectedly succeeded"
            exit 1
          fi

  performance:
    name: Native performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: moon update
      - name: Measure and publish performance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/performance.py --output-dir "$RUNNER_TEMP/performance-results"
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-ubuntu-latest-native
          path: ${{ runner.temp }}/performance-results/
