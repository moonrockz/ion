name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Check formatting
        run: |
          moon fmt
          git diff --exit-code || (echo "::error::moon fmt produced changes — run 'moon fmt' locally and commit" && exit 1)

      - name: Check code
        run: moon check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Run unit tests
        run: mise run test:unit

  build-native:
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ion-linux-amd64
          - os: macos-latest
            artifact: ion-macos-arm64
          - os: windows-latest
            artifact: ion-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Build native binary
        run: mise run build:native

  cli-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Print an Ion fixture
        run: moon run pkgs -- print tests/fixtures/sample.ion

      - name: Convert an Ion fixture to JSON
        run: moon run pkgs -- json tests/fixtures/sample.ion

      - name: Stream Ion from stdin
        run: moon run pkgs -- hash - < tests/fixtures/sample.ion

      - name: Convert a JSON fixture to Ion
        run: moon run pkgs -- fromjson tests/fixtures/sample.json

      - name: Validate fixtures (a violation must exit non-zero)
        run: |
          if moon run pkgs -- validate tests/fixtures/person.isl person tests/fixtures/person.ion; then
            echo "::error::validation unexpectedly succeeded"
            exit 1
          fi
