name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run setup:deps

      - name: Check formatting
        run: mise run format:check

      - name: Check code
        run: mise run test:check

      - name: Test CI tooling
        run: mise run test:scripts

  unit-tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm
          - os: ubuntu-latest
            target: native
          - os: ubuntu-latest
            target: js
          - os: ubuntu-latest
            target: wasm-gc
          - os: windows-latest
            target: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: hustcer/setup-moonbit@v1

      - uses: actions/setup-node@v4
        if: matrix.target == 'js'
        with:
          node-version: '24'

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run setup:deps

      - name: Run unit tests
        id: tests
        shell: bash
        run: >-
          mise run ci:test --target ${{ matrix.target }}
          ${{ matrix.target == 'wasm' && '--coverage' || '' }}
          --log "$RUNNER_TEMP/conformance-results/moon-test.log"

      - name: Publish conformance summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          TEST_TARGET: ${{ matrix.target }}
        run: >-
          mise run ci:conformance-summary
          "$RUNNER_TEMP/conformance-results/moon-test.log"
          --exit-code "$TEST_EXIT_CODE"
          --target "$TEST_TARGET"
          --output-dir "$RUNNER_TEMP/conformance-results"

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-${{ matrix.os }}-${{ matrix.target }}
          path: ${{ runner.temp }}/conformance-results/

      - name: Publish coverage
        if: always() && matrix.target == 'wasm'
        shell: bash
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: >-
          mise run ci:coverage-summary
          --exit-code "$TEST_EXIT_CODE"
          --target wasm
          --output-dir "$RUNNER_TEMP/coverage-results"

      - name: Upload coverage results
        if: always() && matrix.target == 'wasm'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-ubuntu-latest-wasm
          path: ${{ runner.temp }}/coverage-results/

  build-native:
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ion-linux-amd64
          - os: macos-latest
            artifact: ion-macos-arm64
          - os: windows-latest
            artifact: ion-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run setup:deps

      - name: Build native binary
        run: mise run build:native

  cli-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run setup:deps

      - name: Smoke-test the CLI
        run: mise run test:cli

  performance:
    name: Native performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Install dependencies
        run: mise run setup:deps
      - name: Measure and publish performance
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run bench --output-dir "$RUNNER_TEMP/performance-results"
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-ubuntu-latest-native
          path: ${{ runner.temp }}/performance-results/
